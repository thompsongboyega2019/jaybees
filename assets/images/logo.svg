<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="jbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcc403"/>
      <stop offset="50%" stop-color="#d73e72"/>
      <stop offset="100%" stop-color="#8f284a"/>
    </linearGradient>
    <filter id="jbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d73e72" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Emblem Icon: Luxury Tiered Cake with Crown & Sparkle -->
  <g transform="translate(10, 10)">
    <!-- Base Plate -->
    <ellipse cx="25" cy="46" rx="22" ry="4" fill="#fcc403" opacity="0.9"/>
    
    <!-- Tier 1 -->
    <rect x="8" y="32" width="34" height="14" rx="3" fill="#8f284a"/>
    <path d="M8 36 Q16.5 40 25 36 Q33.5 40 42 36" stroke="#fcc403" stroke-width="1.5" fill="none"/>
    
    <!-- Tier 2 -->
    <rect x="13" y="20" width="24" height="12" rx="3" fill="#d73e72"/>
    <path d="M13 24 Q19 27 25 24 Q31 27 37 24" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.9"/>
    
    <!-- Tier 3 / Crown topper -->
    <path d="M18 12 L21 16 L25 9 L29 16 L32 12 L30 19 L20 19 Z" fill="#fcc403" filter="url(#jbGlow)"/>
    
    <!-- Sparkles -->
    <circle cx="43" cy="14" r="1.5" fill="#fcc403"/>
    <circle cx="7" cy="22" r="1" fill="#fcc403"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(68, 12)">
    <!-- Main Name -->
    <text x="0" y="26" font-family="'Playfair Display', serif" font-weight="800" font-size="25" fill="#8f284a" letter-spacing="1">
      Jayb<tspan fill="#d73e72">ees</tspan>
    </text>
    
    <!-- Subtitle / Descriptor -->
    <text x="1" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8.5" fill="#fcc403" letter-spacing="3.5">
      CONFECTIONERY
    </text>
  </g>
</svg>
